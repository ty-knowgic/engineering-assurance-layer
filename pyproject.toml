[build-system]
# >=77 for PEP 639 `license` as an SPDX string and `license-files`.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-assurance-layer"
version = "0.0.2"
description = "Spec-to-constraint review tool for engineering assurance workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Knowgic Technology", email = "tetsuy@knowgictech.com" },
]
maintainers = [
    { name = "Tetsu Yamaguchi", email = "tetsuy@knowgictech.com" },
]
keywords = ["assurance", "verification", "robotics", "ros2", "nav2", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "z3-solver>=4.12",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/ty-knowgic/engineering-assurance-layer"
Source = "https://github.com/ty-knowgic/engineering-assurance-layer"

[project.scripts]
eal = "eal.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eal = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
