# SMACC2 atomic mode states validation model.
# This is an EAL-oriented abstraction of a minimal SMACC2 state machine slice.

entities:
  - name: smacc2_atomic_mode_machine
    description: Minimal atomic mode-state machine abstraction

signals:
  - name: mode_request
    kind: internal
    unit: bool
    bounds:
      min: 0
      max: 1
  - name: transition_ack
    kind: internal
    unit: bool
    bounds:
      min: 0
      max: 1
  - name: state_residency_ms
    kind: timing
    unit: ms
    bounds:
      min: 0
      max: 500

states:
  - name: StModeA
    description: Active mode A state
  - name: StModeB
    description: Active mode B state

modes:
  - name: MODE_A
    description: First mode
  - name: MODE_B
    description: Second mode

transitions:
  - from: StModeA
    to: StModeB
    guard: "mode_request == 1"
  - from: StModeB
    to: StModeA
    guard: "mode_request == 0"

parameters:
  mode_switch_response_ms: 100
  max_mode_request: 1

invariants:
  - "mode_request <= 1 at all times"

mode_constraints:
  - id: MCON-001
    mode: MODE_A
    signal: mode_request
    operator: <=
    value: 1
  - id: MCON-002
    mode: MODE_B
    signal: mode_request
    operator: <=
    value: 1
