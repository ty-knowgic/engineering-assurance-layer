# SMACC2 atomic mode states assumption-gap validation model.
# Structural model is valid, but assumptions are intentionally weak for e-stop.

entities:
  - name: smacc2_atomic_mode_machine
    description: Minimal atomic mode-state machine abstraction

signals:
  - name: mode_request
    kind: internal
    unit: bool
    bounds:
      min: 0
      max: 1
  - name: transition_ack
    kind: internal
    unit: bool
    bounds:
      min: 0
      max: 1
  - name: e_stop_active
    kind: sensor
    unit: bool
    bounds:
      min: 0
      max: 1

states:
  - name: StModeA
    description: Active mode A state
  - name: StModeB
    description: Active mode B state

modes:
  - name: MODE_A
    description: First mode
  - name: MODE_B
    description: Second mode

transitions:
  - from: StModeA
    to: StModeB
    guard: "mode_request == 1"
  - from: StModeB
    to: StModeA
    guard: "mode_request == 0"

parameters:
  max_mode_request: 1
  max_estop_signal: 1

mode_constraints:
  - id: MCON-001
    mode: MODE_A
    signal: mode_request
    operator: <=
    value: 1
  - id: MCON-002
    mode: MODE_B
    signal: mode_request
    operator: <=
    value: 1
  - id: MCON-003
    mode: MODE_A
    signal: e_stop_active
    operator: <=
    value: 1
