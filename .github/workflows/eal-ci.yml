name: eal-ci

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test-and-review:
    runs-on: ubuntu-latest
    env:
      EAL_POLICY_PROFILE: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: "Run EAL CI smoke review (policy: ci)"
        id: review_run
        continue-on-error: true
        run: |
          mkdir -p out/ci_smoke_review
          {
            echo "event=$GITHUB_EVENT_NAME"
            echo "policy_profile=${EAL_POLICY_PROFILE}"
            echo "python=$(python --version 2>&1)"
            echo "pwd=$(pwd)"
            echo "repo_root_contents:"
            ls -la
            echo "examples/ci_smoke contents:"
            ls -la examples/ci_smoke
          } > out/ci_smoke_review/ci_debug.txt

          python -m eal.cli review \
            --spec examples/ci_smoke/spec.md \
            --model examples/ci_smoke/model.yaml \
            --policy-profile "${EAL_POLICY_PROFILE}" \
            --out out/ci_smoke_review \
            >> out/ci_smoke_review/ci_debug.txt 2>&1

      - name: Check SARIF availability
        id: sarif_check
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || false }}
        run: |
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SARIF upload for fork-based pull_request events"
          elif [ -f out/ci_smoke_review/results.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish EAL SARIF to GitHub code scanning
        if: ${{ steps.sarif_check.outputs.exists == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: out/ci_smoke_review/results.sarif
          category: eal-ci-smoke

      - name: Upload EAL review artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eal-ci-review-artifacts
          path: out/ci_smoke_review
          if-no-files-found: warn

      - name: Fail job if EAL review failed
        if: ${{ steps.review_run.outcome != 'success' }}
        run: |
          echo "EAL CI smoke review failed. See uploaded artifacts and ci_debug.txt for details."
          exit 1
