name: eal-ci

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test-and-review:
    runs-on: ubuntu-latest
    env:
      EAL_POLICY_PROFILE: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run EAL CI smoke review (policy: ci)
        run: |
          python -m eal.cli review \
            --spec examples/ci_smoke/spec.md \
            --model examples/ci_smoke/model.yaml \
            --policy-profile "${EAL_POLICY_PROFILE}" \
            --out out/ci_smoke_review

      - name: Check SARIF availability
        id: sarif_check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SARIF upload for fork-based pull request"
          elif [ -f out/ci_smoke_review/results.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish EAL SARIF to GitHub code scanning
        if: steps.sarif_check.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/ci_smoke_review/results.sarif
          category: eal-ci-smoke

      - name: Upload EAL review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eal-ci-review-artifacts
          path: out/ci_smoke_review
          if-no-files-found: warn
